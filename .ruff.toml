# Configuración del Linter para el proyecto EVM
line-length = 100
target-version = "py310"

[lint]
select = ["E", "F", "B", "I"]

# Ignorar E501 (longitud de línea) y B008 (Depends() de FastAPI)
ignore = ["E501", "B008"]

exclude = [
    ".git",
    "venv",
    ".venv",
    "__pycache__",
    "build",
    "dist"
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]